# Publishes the Sol Check demo to GitHub Pages (live link for judges).
# Runs only when started by hand (Actions → Deploy demo to GitHub Pages → Run workflow).
# Uses the native-style build: GitHub Pages cannot serve the camera runtime's
# extensionless "+esm" modules as JavaScript, so they are renamed to .mjs.
# The hosted link works online; offline install is in the local build and phone apps.
name: Deploy demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:native
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
